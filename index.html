.sh{display:block;width:100%;text-align:start;font-size:15px;font-weight:500;color:var(--mut);padding:14px 0 6px}
.sb.shut{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 18px;border-radius:22px;color:#F3E7C4;background:radial-gradient(circle at 15% 0%,rgba(224,190,100,.35),transparent 45%),linear-gradient(135deg,#143F34,#235C4B);margin-bottom:14px;position:relative;overflow:hidden;border:1px solid rgba(232,207,138,.4)}

.top>*{position:relative}
.bk{position:absolute;left:58px;bottom:-4px;width:78px;opacity:.5;pointer-events:none}
.tt{font-family:Amiri,serif;font-size:30px;font-weight:700;line-height:1.2}
.ts{font-size:14px;opacity:.9;margin-top:2px}

.topline{display:flex;gap:12px;align-items:stretch}
.pillt{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:17px;background:var(--acc2);border-radius:16px;padding:10px}
.tile{flex:none;min-width:118px;text-align:center;background:var(--acc2);border-radius:16px;padding:8px 12px}
.mapt{display:inline-block;background:var(--acc);color:var(--onacc);padding:4px 16px;border-radius:99px;font-weight:700;font-size:14px;margin:18px 0 4px}
.map{gap:8px;justify-content:center}.map i{width:16px;height:16px;cursor:pointer}

.mcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:16px;text-align:center}
.mt{display:inline-block;background:var(--acc);color:var(--onacc);padding:3px 16px;border-radius:99px;font-weight:700;font-size:14px;margin-bottom:10px}
.mrow{display:flex;justify-content:space-around}.mrow b{font-size:22px}
.chips{display:flex;gap:8px;margin-top:12px}.chip{flex:1;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 2px;font-size:12px;color:var(--mut);line-height:1.5}.chip b{font-size:18px}
.foot{margin-top:16px;text-align:center;background:linear-gradient(135deg,#143F34,#235C4B);color:#F3E7C4;border-radius:14px;padding:12px;font-family:Amiri,serif;font-size:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#D9B45A;--gold2:#3A3115}}

.btn{padding:13px 20px;border-radius:14px}.ok{padding:9px 16px}.row{padding:12px 14px;margin-bottom:10px;border-radius:14px}
.hero{box-shadow:0 2px 12px rgba(20,63,52,.07)}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);margin:18px 0 6px}.orn span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}

.row.l0{border-inline-start:7px solid #3FA37F}.row.l1{border-inline-start:7px solid #D1A62C}.row.l2{border-inline-start:7px solid #E0782E}.row.l3{border-inline-start:7px solid #C2412D}
@media (prefers-reduced-motion:no-preference){.ok:active{transform:scale(.96)}}
</style>

else if(d.exp){var fn="quran-review-"+new Date().toISOString().slice(0,10)+".json",js=JSON.stringify(S),mg=document.getElementById("msg");if(!window.claude){blobDl(fn,js);return}try{claude.use("downloads").then(function(dl){if(!dl)throw 0;return dl.save({filename:fn,data:js})}).catch(function(){mg.innerHTML='التنزيل مش متاح. انسخ النص ده واحفظه:<textarea readonly>'+esc(js)+'</textarea>'})}catch(x){mg.textContent="التنزيل مش متاح هنا."}}
else if(d.revpart){var gp=GR[+d.revpart];for(var k=gp[1];k<=gp[2];k++)if(S.s[k]){var rr=S.s[k].r||[];rr.push(Date.now());S.s[k].r=rr.slice(-500)}save()}else if(d.selpart){var gq=GR[+d.selpart];for(var k2=gq[1];k2<=gq[2];k2++)if(!S.s[k2])sel[k2]=1;document.getElementById("lst").innerHTML=listHtml();barHtml()}else if(d.weak){n=+d.weak;S.s[n].weak=!S.s[n].weak;save()}
